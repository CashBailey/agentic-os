[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-os"
version = "0.1.0"
description = "Agentic OS: tool-neutral context, memory, policies, and adapters for Claude/Gemini/Codex."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Agentic OS" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
agentos = "agentos_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentos_cli*"]
exclude = ["tests*", "agent-os*", "frontend*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
