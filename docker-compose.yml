services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentos-pgdata:/var/lib/postgresql/data
      - ./backend/db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentos-pgdata:
    name: agentos-pgdata
