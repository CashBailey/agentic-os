[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-backend"
version = "0.1.0"
description = "Agentic OS backend (FastAPI + SQLAlchemy + Postgres + pgvector)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
embeddings = [
    "sentence-transformers>=2.5",
]

[project.scripts]
agentos-worker = "app.worker:main"
agentos-backend = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "db: requires a live Postgres + pgvector database",
]
